name: Test and deploy Weeknight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build production app
        run: npm run build -- --base=/meal-planner/
        env:
          # Public browser connection values; row-level security protects data.
          VITE_SUPABASE_URL: https://qqugcyudrhczjbquvxqk.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_WbEbPMOLIS3yxBDHDINxAg_8RWACqyi
      - name: Preserve original planner
        run: |
          mkdir -p dist/legacy
          cp ../index.html ../recipes.json ../cocktails.json ../smoothies.json ../smoker-recipes.json ../prefs.json ../current-week.json dist/legacy/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
